aid: naboo
name: Naboo
description: >-
  Naboo is Reasoning Layer infrastructure for enterprise AI agents, built on a
  Decision Graph that models how a company actually decides, ships, and unblocks
  - who decided what, what triggered each decision, what blocks it, and what
  depends on it - across code, tickets, pull requests, docs, Slack, runtime, and
  internal services. Any AI agent in the organization queries the graph in
  GraphQL, or through an MCP server that turns plain intent into a structured
  query, and gets a structured answer instead of a list of search results. Naboo
  deploys on-premise or in a customer VPC with zero data egress, integrates with
  any LLM (OpenAI, Anthropic, Llama, Mistral) and agentic framework (LangChain,
  AutoGen, CrewAI), and enforces existing role-based access controls at retrieval
  time. Founded in 2023 by Gilad Salinger (CEO) and Dror Wolmer (CTO), with
  production customers Global-E (NASDAQ: GLBE) and Melio.
